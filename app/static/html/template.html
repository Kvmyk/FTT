<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>FindMyThrone - Find Your Throne!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/static/html/toilet_icon.png">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="/static/js/main.js"></script> 
    <script>
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = ''; // Wyczyść poprzednie podglądy

            for (let file of this.files) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'imagePreview';
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
    <style>
      .leaflet-interactive {
        pointer-events: auto;
      }
    </style>
</head>
<body>
    <div class="circle-plus">+</div>
    <div id="nearestPinInfo">
        <p id="nearestPinText"></p>
        <button id="cancelNavigationBtn" onclick="clearNavigation()" style="display:none; margin-top: 10px; padding: 8px 16px; background-color: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
            ❌ Anuluj nawigację
        </button>
    </div>
    <!-- Modal -->
    <div id="map"></div>
    <div id="loadingOverlay">
        <img src="/static/html/Logo.png" alt="Logo" class="logo">
        <div class="spinner"></div>
    </div>
    <div id="myModal" style="display:none;">
        <span id="closeModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="text" id="userInput" placeholder="Wpisz adres... (wymagane)" required>
        <input type="text" id="placeNameInput" placeholder="Nazwa miejsca">
        <textarea id="descriptionInput" placeholder="Dodaj opis... (wymagane)" required></textarea>
        <label><input type="checkbox" id="paidInput" name="payable">Płatna</label>
        <label><input type="checkbox" id="customersOnlyInput" name="onlyForClients">Tylko dla klientów</label>
        <label><input type="checkbox" id="disabilityInput" name="forDisabled">Dla niepełnosprawnych</label>
        <input type="number" id="ratingInput" placeholder="Ocena (1-10) (wymagane)" min="1" max="10" required>
        <!-- Weekday opening hours section -->
        <div class="hours-section">
            <h4>Godziny otwarcia (dni powszednie)</h4>
            <div class="hours-inputs">
                <label>Od: <input type="time" id="weekdayOpenTime" name="weekdayOpen"></label>
                <label>Do: <input type="time" id="weekdayCloseTime" name="weekdayClose"></label>
            </div>
        </div>
        
        <!-- Weekend opening hours section -->
        <div class="hours-section">
            <h4>Godziny otwarcia (weekendy)</h4>
            <div class="hours-inputs">
                <label>Od: <input type="time" id="weekendOpenTime" name="weekendOpen"></label>
                <label>Do: <input type="time" id="weekendCloseTime" name="weekendClose"></label>
            </div>
        </div>
        <input type="file" id="photoInput" accept=".jpg,.png" multiple>
        <div id="imagePreviewContainer"></div>
        <label class="switch">
          <input type="checkbox" id="useUserLocation">
          <span class="slider"></span>
        </label>
        <span class="switch-label">Użyj mojej lokalizacji</span>
        <button onclick="submitModal()">Gotowe</button>
    </div>

    <!-- New Comment Modal -->
    <div id="commentModal" style="display:none;">
        <span id="closeCommentModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="number" id="commentRating" placeholder="Ocena (1-10)" min="1" max="10" required>
        <textarea id="commentText" placeholder="Dodaj komentarz..." required></textarea>
        <button onclick="submitComment()">Dodaj komentarz</button>
    </div>
    <!-- Filter Button -->
    <div class="filter-button"><i class="fas fa-filter"></i></div>

    <!-- Filter Modal -->
    <div id="filterModal">
        <span id="closeFilterModal">&times;</span>
        <h3>Filtry</h3>
        <label><input type="checkbox" id="filterPayable">Płatna</label>
        <label><input type="checkbox" id="filterForClients">Tylko dla klientów</label>
        <label><input type="checkbox" id="filterForDisabled">Dla niepełnosprawnych</label>
        <label>Minimalna ocena: <input type="number" id="filterRating" min="0" max="10" value="0"></label>
        <button onclick="applyFilters()">Zastosuj filtry</button>
        <button onclick="showAllToilets()">Pokaż wszystkie toalety</button>
    </div>
    <img src="data:image/jpeg;base64,{photo_base64}" loading="lazy" class="marker-image">
    <div class="location-tracking-toggle">
        <label class="switch">
            <input type="checkbox" id="locationTrackingToggle">
            <span class="slider"></span>
        </label>
        <span class="switch-label">Śledzenie lokalizacji</span>
    </div>

    <!-- Copyright Footer -->
    <footer class="copyright-footer">
        <p>© 2025 Find My Throne - All Rights Reserved</p>
    </footer>
</body>
</html>
