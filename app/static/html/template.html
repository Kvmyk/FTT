<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Map</title>
    <!-- To jest kluczowe dla responsywności! -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Załadowanie stylów -->
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Załadowanie skryptów (jeśli nie wymagają <body> onload, można tu) -->
    <script src="/static/js/main.js"></script> 
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/nearest_toilet_distance')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const nearestPinInfo = document.getElementById('nearestPinInfo');
                        const nearestPinText = document.getElementById('nearestPinText');
                        nearestPinText.innerText = `Od twojej lokalizacji do najbliższej toalety jest ${data.distance} - ${data.name}`;
                        nearestPinInfo.classList.add('show');

                        // Ukryj bloczek po 3 sekundach
                        setTimeout(() => {
                            nearestPinInfo.classList.remove('show');
                            nearestPinInfo.classList.add('hide');
                        }, 3000);
                    }
                })
                .catch(error => console.error('Error:', error));
        });

        // Pokazujemy bloczek, gdy użytkownik najedzie kursorem na trasę (path w SVG)
        document.addEventListener('mouseover', function(event) {
            if (event.target.tagName === 'path') { 
                const nearestPinInfo = document.getElementById('nearestPinInfo');
                nearestPinInfo.classList.remove('hide');
                nearestPinInfo.classList.add('show');
            }
        });

        // Ukrywamy bloczek, gdy użytkownik opuści trasę
        document.addEventListener('mouseout', function(event) {
            if (event.target.tagName === 'path') {
                const nearestPinInfo = document.getElementById('nearestPinInfo');
                nearestPinInfo.classList.remove('show');
                nearestPinInfo.classList.add('hide');
            }
        });
    </script>

    <style>
        /* Styl podstawowy dla wszystkich urządzeń */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            padding: 20px;
            margin: 0 auto;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        #myModal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }

        #myModal input, #myModal textarea {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Styl dla urządzeń mobilnych */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .header, .footer {
                text-align: center;
            }

            .content {
                font-size: 14px;
            }

            #myModal input, #myModal textarea {
                font-size: 14px;
            }
        }

        /* Styl dla tabletów */
        @media (min-width: 601px) and (max-width: 1024px) {
            .container {
                padding: 15px;
            }

            .header, .footer {
                text-align: center;
            }

            .content {
                font-size: 16px;
            }

            #myModal input, #myModal textarea {
                font-size: 16px;
            }
        }

        /* Styl dla komputerów stacjonarnych */
        @media (min-width: 1025px) {
            .container {
                max-width: 1200px;
            }

            .content {
                font-size: 18px;
            }

            #myModal input, #myModal textarea {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <!-- Przyciski, modale, itp. -->
    <div class="circle-plus" id="openModalBtn">+</div>

    <!-- Modal -->
    <div id="myModal">
        <span id="closeModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="text" id="userInput" placeholder="Wpisz coś...">
        <textarea id="descriptionInput" placeholder="Dodaj opis..."></textarea>
        <label>
            <input type="checkbox" id="paidInput" name="payable"> Płatna
        </label>
        <label>
            <input type="checkbox" id="customersOnlyInput" name="onlyForClients"> Tylko dla klientów
        </label>
        <input type="number" id="ratingInput" placeholder="Ocena (1-10)" min="1" max="10">
        <input type="file" id="photoInput" multiple>
        <button onclick="submitModal()">Gotowe</button>
    </div>

    <!-- Nearest Pin Info -->
    <div id="nearestPinInfo">
        <p id="nearestPinText"></p>
    </div>

    <!-- Kontener na mapę (zajmuje całą przestrzeń) -->
    <div id="map"></div>

    <!-- Skrypt do załadowania mapy -->
    <script>
        fetch('/render_map')
            .then(response => response.text())
            .then(html => {
                document.getElementById('map').innerHTML = html;
            })
            .catch(error => console.error('Error loading map:', error));
    </script>
</body>
</html>
