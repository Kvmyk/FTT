<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FindMyThrone - Find Your Throne!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/static/html/toilet_icon.png">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <script src="/static/js/main.js"></script> 
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/nearest_toilet_distance')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const nearestPinInfo = document.getElementById('nearestPinInfo');
                        const nearestPinText = document.getElementById('nearestPinText');
                        nearestPinText.innerText = `Od twojej lokalizacji do najbliższej toalety jest ${data.distance} - ${data.name}`;
                        nearestPinInfo.classList.add('show');

                        // Ukryj blok po 3 sekundach
                        setTimeout(() => {
                            nearestPinInfo.classList.remove('show');
                            nearestPinInfo.classList.add('hide');
                        }, 3000);
                    }
                })
                .catch(error => console.error('Error:', error));

            fetch('/render_map')
                .then(response => response.text())
                .then(mapHtml => {
                    // Wstaw wygenerowany HTML mapy
                    const mapContainer = document.getElementById('map');
                    mapContainer.innerHTML = mapHtml;

                    // Znajdź `iframe` i ustaw odpowiednie style
                    const mapIframe = mapContainer.querySelector('iframe');
                    if (mapIframe) {
                        mapIframe.style.width = '100%';
                        mapIframe.style.height = '100vh'; // Dopasuj do 100% wysokości okna przeglądarki
                        mapIframe.style.border = 'none'; // Usuń obramowanie, jeśli niepotrzebne

                        // Dodaj nasłuchiwanie po załadowaniu zawartości iframe
                        mapIframe.onload = function() {
                            const iframeDocument = mapIframe.contentDocument || mapIframe.contentWindow.document;
                            const paths = iframeDocument.querySelectorAll('path');
                            paths.forEach(path => {
                                path.addEventListener('mouseover', () => {
                                    const nearestPinInfo = document.getElementById('nearestPinInfo');
                                    nearestPinInfo.classList.remove('hide');
                                    nearestPinInfo.classList.add('show');
                                });
                                path.addEventListener('mouseout', () => {
                                    const nearestPinInfo = document.getElementById('nearestPinInfo');
                                    nearestPinInfo.classList.remove('show');
                                    nearestPinInfo.classList.add('hide');
                                });
                            });
                        };
                    }
                })
                .catch(err => console.error('Error fetching map:', err));
        });
        
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = ''; // Wyczyść poprzednie podglądy

            for (let file of this.files) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'imagePreview';
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</head>
<body>
    <div class="circle-plus">+</div>
    <div id="nearestPinInfo">
        <p id="nearestPinText"></p>
    </div>
    <!-- Modal -->
    <div id="map"></div>
    <div id="loadingOverlay">
        <img src="/static/html/Logo.png" alt="Logo" class="logo">
        <div class="spinner"></div>
    </div>
    <div id="myModal">
        <span id="closeModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="text" id="userInput" placeholder="Wpisz coś..." required>
        <textarea id="descriptionInput" placeholder="Dodaj opis..." required></textarea>
        <label><input type="checkbox" id="paidInput" name ="payable">Płatna</label>
        <label><input type="checkbox" id="customersOnlyInput" name ="onlyForClients">Tylko dla klientów</label>
        <input type="number" id="ratingInput" placeholder="Ocena (1-10)" min="1" max="10" required>
        <input type="file" id="photoInput" accept=".jpg,.png" multiple>
        <div id="imagePreviewContainer"></div>
        <button onclick="submitModal()">Gotowe</button>
    </div>

    <!-- New Comment Modal -->
    <div id="commentModal" style="display:none;">
        <span id="closeCommentModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="number" id="commentRating" placeholder="Ocena (1-10)" min="1" max="10" required>
        <textarea id="commentText" placeholder="Dodaj komentarz..." required></textarea>
        <button onclick="submitComment()">Dodaj komentarz</button>
    </div>
</body>
</html>
