<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FindMyThrone - Find Your Throne!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/static/html/toilet_icon.png">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="/static/js/main.js"></script> 
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/nearest_toilet_distance')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {

                        const nearestPinLat = data.nearest_pin_lat;
                        const nearestPinLon = data.nearest_pin_lon;

                        if (!isInOpoleProvince(nearestPinLat, nearestPinLon)) {
                            alert('Najbliższy marker znajduje się poza województwem opolskim. Nawigacja jest dostępna tylko do markerów w województwie opolskim.');
                            return;
                        }

                        const nearestPinInfo = document.getElementById('nearestPinInfo');
                        const nearestPinText = document.getElementById('nearestPinText');
                        nearestPinText.innerText = `Od twojej lokalizacji do najbliższej toalety jest ${data.distance} - ${data.name}.\nSzacowany czas dotarcia: ${data.duration} min 🚶`;
                        nearestPinInfo.classList.add('show');
                    }
                })
                .catch(error => console.error('Error:', error));

                
        });
        
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = ''; // Wyczyść poprzednie podglądy

            for (let file of this.files) {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'imagePreview';
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
    <style>
      .leaflet-interactive {
        pointer-events: auto;
      }
    </style>
</head>
<body>
    <div class="circle-plus">+</div>
    <div id="nearestPinInfo">
        <p id="nearestPinText"></p>
    </div>
    <!-- Modal -->
    <div id="map"></div>
    <div id="loadingOverlay">
        <img src="/static/html/Logo.png" alt="Logo" class="logo">
        <div class="spinner"></div>
    </div>
    <div id="myModal" style="display:none;">
        <span id="closeModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="text" id="userInput" placeholder="Wpisz coś..." required>
        <textarea id="descriptionInput" placeholder="Dodaj opis..." required></textarea>
        <label><input type="checkbox" id="paidInput" name="payable">Płatna</label>
        <label><input type="checkbox" id="customersOnlyInput" name="onlyForClients">Tylko dla klientów</label>
        <label><input type="checkbox" id="disabilityInput" name="forDisabled">Dla niepełnosprawnych</label>
        <input type="number" id="ratingInput" placeholder="Ocena (1-10)" min="1" max="10" required>
        <input type="file" id="photoInput" accept=".jpg,.png" multiple>
        <div id="imagePreviewContainer"></div>
        <label class="switch">
          <input type="checkbox" id="useUserLocation">
          <span class="slider"></span>
        </label>
        <span class="switch-label">Użyj mojej lokalizacji</span>
        <button onclick="submitModal()">Gotowe</button>
    </div>

    <!-- New Comment Modal -->
    <div id="commentModal" style="display:none;">
        <span id="closeCommentModal" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <input type="number" id="commentRating" placeholder="Ocena (1-10)" min="1" max="10" required>
        <textarea id="commentText" placeholder="Dodaj komentarz..." required></textarea>
        <button onclick="submitComment()">Dodaj komentarz</button>
    </div>
    <!-- Filter Button -->
    <div class="filter-button"><i class="fas fa-filter"></i></div>

    <!-- Filter Modal -->
    <div id="filterModal">
        <span id="closeFilterModal">&times;</span>
        <h3>Filtry</h3>
        <label><input type="checkbox" id="filterPayable">Płatna</label>
        <label><input type="checkbox" id="filterForClients">Tylko dla klientów</label>
        <label><input type="checkbox" id="filterForDisabled">Dla niepełnosprawnych</label>
        <label>Minimalna ocena: <input type="number" id="filterRating" min="0" max="10" value="0"></label>
        <button onclick="applyFilters()">Zastosuj filtry</button>
        <button onclick="showAllToilets()">Pokaż wszystkie toalety</button>
    </div>
    <img src="data:image/jpeg;base64,{photo_base64}" loading="lazy" class="marker-image">
</body>
</html>
